{% extends "layout.html" %}
{% block content %}
<div class="row">
    <div class="col-md-6">
        <div class="card shadow-sm p-4 mb-4">
            <h3>Register Contextual Policy</h3>
            <hr>
           <form action="{{ url_for('register_policy') }}" method="POST">
    <div class="mb-3">
        <label>Subject (Device ID)</label>
        <input type="text" name="subject" class="form-control" placeholder="Sensor_01" required>
    </div>
    <div class="mb-3">
        <label>Object (Resource)</label>
        <input type="text" name="object" class="form-control" placeholder="HVAC_Control" required>
    </div>
    <div class="mb-3">
        <label>Action</label>
        <select name="action" class="form-select">
            <option value="READ">READ</option>
            <option value="WRITE">WRITE</option>
        </select>
    </div>
    <div class="mb-3">
        <label>Min Trust Level ($C_{min}$)</label>
        <input type="number" name="trust_level" class="form-control" min="0" max="100" value="50">
    </div>
    <button type="submit" class="btn btn-primary w-100">Deploy to Ledger</button>
</form>
        </div>
    </div>

    <div class="col-md-6">
        <div class="card shadow-sm p-4 h-100">
            <h3>Upload IoT Logs</h3>
            <p class="text-muted">Upload a CSV to generate dynamic contextual reports.</p>
            <form action="/upload" method="POST" enctype="multipart/form-data" class="mt-4">
                <input type="file" name="file" class="form-control mb-3" accept=".csv" required>
                <button type="submit" class="btn btn-success w-100">Update Reports</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
